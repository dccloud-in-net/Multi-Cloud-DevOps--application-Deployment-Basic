# ==============================================================================
# GitHub Actions Continuous Integration (CI) Workflow
# ==============================================================================
name: "BankPro CI Pipeline"

on:
  push:
    branches: [ "main", "dev", "stage" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-test:
    name: "Maven Build & Test"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: "Run Maven Build"
        run: mvn -f App/pom.xml clean package -B -DskipTests

      - name: "Run Unit Tests"
        run: mvn -f App/pom.xml test -B

      # - name: "SonarQube Scan"
      #   uses: sonarsource/sonarqube-scan-action@v2
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker-push:
    name: "Docker Build & Push"
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # Configure AWS Credentials
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: "Log in to AWS ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Configure Azure Credentials
      - name: "Log in to Azure CLI"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Log in to Azure ACR"
        run: |
          az acr login --name bankproregistryprodsub

      # Docker build & push
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Build & Push ECR/ACR Docker Images"
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          ACR_REGISTRY="bankproregistryprodsub.azurecr.io"
          IMAGE_NAME="bankpro-microservice"
          IMAGE_TAG="${{ github.sha }}"

          # Build application image using multi-stage Dockerfile
          docker build -t $IMAGE_NAME:$IMAGE_TAG -f App/docker/Dockerfile App/

          # Tag for AWS ECR
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:latest
          
          # Tag for Azure ACR
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker tag $IMAGE_NAME:$IMAGE_TAG $ACR_REGISTRY/$IMAGE_NAME:latest

          # Push to registries
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest
          docker push $ACR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ACR_REGISTRY/$IMAGE_NAME:latest
